schema_version = 3

[defaults]
backend = "cc-codex"
max_sessions = 40
context_budget = 200000
codex_sandbox = "danger-full-access"

[defaults.cursor]
dev_model = "claude-opus-4-8"
dev_effort = "high"
review_model = "gpt-5.5"
review_effort = "medium"

# Both cc-codex roles pick a CLI agent, and each agent carries its own
# model/effort defaults in its own namespace.
[defaults."cc-codex"]
dev_agent = "claude"
review_agent = "codex"

[defaults."cc-codex".dev.claude]
model = "claude-opus-4-8"
effort = "max"

[defaults."cc-codex".dev.codex]
model = "gpt-5.5"
effort = "xhigh"

[defaults."cc-codex".review.claude]
model = "claude-opus-4-8"
effort = "max"

[defaults."cc-codex".review.codex]
model = "gpt-5.5"
effort = "xhigh"

# Named profiles are complete role selections for each backend. A profile's
# cc-codex dev_agent and review_agent are part of the profile; explicit CLI
# flags may still override any individual field.
[profiles.standard.cursor]
dev_model = "claude-opus-4-8"
dev_effort = "max"
review_model = "gpt-5.5"
review_effort = "xhigh"

[profiles.standard."cc-codex"]
dev_agent = "claude"
review_agent = "codex"
dev_model = "claude-opus-4-8"
dev_effort = "max"
review_model = "gpt-5.5"
review_effort = "xhigh"

[profiles.excellent.cursor]
dev_model = "claude-opus-5"
dev_effort = "max"
review_model = "gpt-5.6-sol"
review_effort = "xhigh"

[profiles.excellent."cc-codex"]
dev_agent = "claude"
review_agent = "codex"
dev_model = "claude-opus-5"
dev_effort = "max"
review_model = "gpt-5.6-sol"
review_effort = "xhigh"

# Model ids this deployment vouches for, per backend and CLI agent. Published
# through `--print-config` so a caller can offer verified choices instead of
# free text. Advisory only: a model outside a catalog still launches, and the
# effort vocabulary that applies to a model is never listed here — the
# orchestrator derives it from the selected agent (cc-codex) or the model
# family (cursor SDK).
[catalog.cursor.cursor]
models = ["claude-opus-4-8", "claude-opus-5", "gpt-5.5", "gpt-5.6-sol"]

[catalog."cc-codex".claude]
models = ["claude-opus-4-8", "claude-opus-5"]

[catalog."cc-codex".codex]
models = ["gpt-5.5", "gpt-5.6-sol"]
